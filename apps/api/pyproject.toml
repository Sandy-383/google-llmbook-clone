[project]
name = "llmbook-api"
version = "0.1.0"
description = "LLMBook API: a local, source-grounded notebook assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "redis>=5.2",
    "celery>=5.4",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
    "httpx>=0.28",
    "python-multipart>=0.0.32",
    "pypdfium2>=5.14.0",
    "pillow>=13.0.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI's Depends() in defaults is idiomatic
    "RUF001", # "›" is used on purpose as the heading-path separator
    "RUF002", # ...also in docstrings that show it
]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the library as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "pgvector.*", "pypdfium2.*", "pytesseract.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.*"]
disallow_untyped_decorators = false # Celery's decorators are untyped

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
