<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <title>LLMBook is offline</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f7f8; --fg: #1c1c1f; --muted: #62626b; --accent: #4f46e5; }
      @media (prefers-color-scheme: dark) { :root { --bg: #121214; --fg: #e6e6ea; --muted: #9b9ba6; --accent: #a5b4fc; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
             font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.25rem; margin: 1.25rem 0 0.5rem; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 1.5rem; }
      button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 0.75rem;
               padding: 0.6rem 1.4rem; cursor: pointer; }
      @media (prefers-color-scheme: dark) { button { color: #15153a; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>LLMBook is offline</h1>
      <p>
        The computer that runs this LLMBook isn't reachable right now. It may be switched off,
        asleep or restarting. Try again in a little while.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
